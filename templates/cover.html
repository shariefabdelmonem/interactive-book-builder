<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}
body{width:1323px;height:1871px;font-family:Cairo;overflow:hidden}
.c{position:relative;width:100%;height:100%;background:#0f2346;color:#fff;overflow:hidden}
.c:before{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 85% 12%,rgba(212,168,83,.22),transparent 38%),
 radial-gradient(circle at 10% 95%,rgba(70,120,200,.35),transparent 45%),
 linear-gradient(170deg,#163261 0%,#0f2346 55%,#0a1a36 100%)}
.grid{position:absolute;inset:0;opacity:.09;background-image:linear-gradient(rgba(255,255,255,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.9) 1px,transparent 1px);background-size:66px 66px}
.band{position:absolute;right:-260px;top:-160px;width:900px;height:380px;background:linear-gradient(100deg,#b8862f,#e8c06a 50%,#b8862f);transform:rotate(28deg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.band2{position:absolute;right:-300px;top:200px;width:900px;height:40px;background:#3156a8;transform:rotate(28deg)}
.band3{position:absolute;left:-200px;bottom:30px;width:900px;height:14px;background:#d4a853;transform:rotate(-12deg);opacity:.85}
.logo{position:absolute;left:90px;top:90px;background:#fff;border-radius:28px;padding:26px 34px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.logo img{height:150px;display:block}
.main{position:absolute;left:110px;right:110px;top:560px}
.tag{display:inline-block;font-weight:800;font-size:34px;letter-spacing:6px;color:#0f2346;background:#e8c06a;padding:8px 28px;border-radius:40px}
h1{font-weight:800;font-size:250px;line-height:1;letter-spacing:6px;margin-top:40px;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.35)}
.line{width:260px;height:12px;background:#e8c06a;border-radius:6px;margin:40px 0 34px}
.sub{font-weight:700;font-size:70px;line-height:1.25}
.yr{font-weight:800;font-size:60px;color:#e8c06a;margin-top:18px;letter-spacing:3px}
.ar{direction:rtl;text-align:right;position:absolute;right:110px;left:110px;top:1330px;border-top:2px solid rgba(255,255,255,.18);padding-top:46px}
.ar .t1{font-weight:800;font-size:62px}
.ar .t2{font-weight:500;font-size:44px;opacity:.85;margin-top:10px}
.badge{position:absolute;left:110px;bottom:120px;display:flex;align-items:center;gap:22px;background:rgba(255,255,255,.08);border:2px solid rgba(232,192,106,.6);border-radius:24px;padding:22px 34px}
.badge .ic{width:64px;height:64px;border-radius:50%;background:#d1232a;display:grid;place-items:center}
.badge b{font-weight:800;font-size:38px;display:block;line-height:1.2}
.badge span{font-weight:500;font-size:28px;opacity:.8;direction:rtl;display:block}
.foot{position:absolute;right:110px;bottom:140px;font-weight:700;font-size:30px;opacity:.7;text-align:right}
</style></head><body><div class="c"><div class="grid"></div><div class="band"></div><div class="band2"></div><div class="band3"></div>

<div><b>Interactive Edition</b><span>نسخة تفاعلية بالإجابات</span></div></div>
