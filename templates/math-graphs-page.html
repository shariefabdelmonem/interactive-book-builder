<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>رياضيات · صفحة ٦٤ · الدالة العكسية ودوال الجذر (صفحة تفاعلية)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--mag:#c4237f;--mag2:#7b2fbf;--acc:#f2b84b;--bar:rgba(18,22,40,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Cairo',system-ui,sans-serif;color:#eef;background:#1b2140;overscroll-behavior:none}
button{font-family:inherit}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(255,255,255,.10),transparent 70%),linear-gradient(160deg,#2b2f63,#151a33)}
#bg:after{content:"";position:absolute;inset:0;opacity:.35;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:22px 22px}
#bar{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:20;background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bar .ttl{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tb.on{background:var(--mag);border-color:var(--mag)}
.tb svg{width:18px;height:18px}
@media (max-width:640px){.tb .lbl{display:none}.tb{padding:0 11px}#bar .ttl{font-size:13px}}
#stage{position:fixed;top:54px;bottom:0;left:0;right:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#zoomer{position:absolute;left:0;top:0;transform-origin:0 0}
#zoomer.anim{transition:transform .28s ease}
#page{position:relative;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.5)}
#page>img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.hs{position:absolute;cursor:pointer;background:#fff}
.hs canvas{position:absolute;inset:0;width:100%;height:100%}
.hs .badge{position:absolute;top:-14px;left:0;font-size:clamp(8px,1.6vw,12px);font-weight:800;color:#fff;background:linear-gradient(135deg,#c4237f,#7b2fbf);padding:1px 8px;border-radius:10px;pointer-events:none;animation:pulse 2.4s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#hint{position:fixed;z-index:22;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(18,22,40,.94);border:1px solid rgba(255,255,255,.15);padding:9px 16px;border-radius:14px;font-size:13px;line-height:1.7;width:max-content;max-width:92vw;text-align:center;transition:opacity .5s;pointer-events:none}
#zlab{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:21;background:rgba(18,22,40,.85);padding:3px 12px;border-radius:12px;font-size:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;direction:ltr}
.drawer{position:fixed;top:54px;bottom:0;right:0;width:min(360px,92vw);z-index:30;background:#1d2244;transform:translateX(105%);transition:transform .35s;overflow:auto;padding:14px 16px}
.drawer.open{transform:none}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;background:rgba(255,255,255,.05);margin-bottom:6px}
.it .sub{display:block;font-size:12px;opacity:.65}
.pg{flex:none;font-size:12px;font-weight:800;background:var(--mag);padding:2px 9px;border-radius:9px}
#scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.on{display:block}
#mback{position:absolute;inset:0;background:rgba(10,10,25,.72);backdrop-filter:blur(3px);opacity:0;transition:opacity .4s}
#modal.show #mback{opacity:1}
#mcard{position:absolute;background:#fbf9fc;color:#2a2233;border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);display:grid;grid-template-columns:1fr 330px;grid-template-rows:auto 1fr;transform-origin:0 0}
#mhead{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid #eadff0;flex-wrap:wrap}
#mhead .t{flex:1;min-width:160px;font-weight:800;font-size:15px}
#mhead .t small{display:block;font-weight:600;font-size:12px;color:#8a7f94}
.mb{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:34px;padding:0 12px;border-radius:17px;border:1px solid #e0d3e8;background:#f6f0f9;color:#2a2233;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.mb.on{background:var(--mag);border-color:var(--mag);color:#fff}
.mb.pri{background:#2a2233;color:#fff;border-color:#2a2233}
#mview{position:relative;min-height:0;background:#fff}
#mview canvas{display:block;width:100%;height:100%;touch-action:none}
#readout{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.94);border:1px solid #eadff0;border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.7;max-width:min(330px,70%)}
.m{font-family:'Times New Roman',serif;font-style:italic;font-size:16px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
#info{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;border:1px solid #e3d5ec;border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.15);font-size:14px;line-height:1.75;display:none}
#info b{color:var(--mag)}
#info .src{font-size:11px;color:#8a7f94;display:block}
#info .x{float:left;border:none;background:none;font-size:20px;cursor:pointer;color:#8a7f94}
#bookfig{position:absolute;top:10px;left:10px;background:#fff;border:1px solid #e3d5ec;border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:none;max-width:48%}
#bookfig img{display:block;max-width:100%;max-height:55vh}
#bookfig div{font-size:12px;font-weight:700;color:#8a7f94;padding:2px 4px 6px}
#mpanel{overflow:auto;padding:12px 14px 20px;border-right:1px solid #eadff0}
#mpanel h4{margin:6px 0;font-size:13px;color:#8a7f94}
.ctl{margin-bottom:12px}
.ctl label{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-bottom:4px;gap:8px}
.ctl label span{color:var(--mag);direction:ltr}
.ctl input[type=range]{width:100%;accent-color:var(--mag);direction:ltr}
.ctl .hint{font-size:12px;color:#7a6f86;line-height:1.6;margin-top:3px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns .mb{flex:1 1 auto}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:6px 0;cursor:pointer}
.chk i{width:14px;height:4px;border-radius:2px;display:inline-block}
.steps{background:#fff;border:1px solid #eadff0;border-radius:10px;padding:8px 10px;font-size:13px;line-height:2}
.quiz{background:#fff;border:2px solid var(--mag);border-radius:12px;padding:12px;font-size:14px;line-height:1.8}
.quiz .qn{font-size:12px;color:#8a7f94;font-weight:700}
.quiz .q{font-weight:800;margin:4px 0 8px}
.quiz .fb{font-weight:800;min-height:24px}
.fb.ok{color:#2e9e5b}.fb.bad{color:#d4473f}
.score{font-size:30px;font-weight:800;color:var(--mag);text-align:center}
@media (max-width:820px),(max-aspect-ratio:1/1){
 #mcard{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) minmax(0,42%)}
 #mpanel{border-right:none;border-top:1px solid #eadff0}
 #mhead .t{flex-basis:100%;font-size:13px}#mhead .t small{display:none}
 #mhead .mb{flex:1;font-size:12px;padding:0 6px}
 #readout{font-size:12px;padding:6px 9px}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="bar">
 <div class="ttl">رياضيات · صفحة ٦٤ · الدالة العكسية ودوال الجذر التربيعي</div>
 <button class="tb" id="bModels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20l5-9 4 5 3-4 6 8z"/></svg><span class="lbl">الرسوم التفاعلية</span></button>
 <button class="tb" id="bZoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M11 8v6M8 11h6"/></svg><span class="lbl">تكبير</span></button>
</div>
<div id="stage"><div id="zoomer"><div id="page"><img id="pimg" alt="صفحة ٦٤"></div></div></div>
<div id="zlab"></div>
<div id="hint">المس أي رسم بياني عليه شارة «تفاعلي» لتتحكم فيه · كبّر بصباعين أو بلمستين سريعتين</div>
<div id="scrim"></div>
<div class="drawer" id="drawer"><h3 style="margin:4px 0 12px">الرسوم التفاعلية</h3><div id="dlist"></div></div>
<div id="modal"><div id="mback"></div><div id="mcard">
 <div id="mhead"><div class="t" id="mtitle"></div>
  <button class="mb" id="mQuiz">اختبرني</button><button class="mb" id="mFig">رسم الكتاب</button><button class="mb pri" id="mClose">إعادة إلى الصفحة</button></div>
 <div id="mview"><canvas id="mc"></canvas><div id="readout"></div><div id="bookfig"><div id="bftitle"></div><img id="bfimg"></div><div id="info"></div></div>
 <div id="mpanel"></div>
</div></div>
<script>
const PAGE_IMG=/*PAGE*/'img/p64.jpg';
const FIG={g1:/*FIG1*/'img/g1.jpg',g2:/*FIG2*/'img/g2.jpg'};
const IW=1063,IH=1394;
const $=s=>document.querySelector(s);
const C={mag:'#c4237f',mag2:'#7b2fbf',grid:'#e9a3c8',gridS:'#d9579c',ink:'#b51f74',faint:'rgba(196,35,127,.28)',ref:'#2b7bd6'};
const AD=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const fmt=v=>{const r=Math.round(v*100)/100;return (r<0?'−':'')+Math.abs(r)};

/* ============ GRAPH ENGINE ============ */
function mkView(ctx,W,H,v){ctx.direction='ltr';const sx=W/(v.x1-v.x0),sy=H/(v.y1-v.y0);return {ctx,W,H,v,X:x=>(x-v.x0)*sx,Y:y=>(v.y1-y)*sy,ux:sx,uy:sy,ix:px=>v.x0+px/sx,iy:py=>v.y1-py/sy}}
function grid(G,o){const {ctx,X,Y}=G,u=Math.min(G.ux,G.uy);ctx.save();ctx.lineWidth=Math.max(1,u*.045);
 ctx.strokeStyle=C.grid;ctx.setLineDash(o.dashed?[u*.16,u*.12]:[u*.12,u*.08]);
 for(let x=Math.ceil(o.gx0);x<=o.gx1;x++){ctx.beginPath();ctx.moveTo(X(x),Y(o.gy0));ctx.lineTo(X(x),Y(o.gy1));ctx.stroke()}
 for(let y=Math.ceil(o.gy0);y<=o.gy1;y++){ctx.beginPath();ctx.moveTo(X(o.gx0),Y(y));ctx.lineTo(X(o.gx1),Y(y));ctx.stroke()}
 ctx.setLineDash([]);ctx.strokeStyle=C.gridS;ctx.lineWidth=Math.max(1.2,u*.07);ctx.strokeRect(X(o.gx0),Y(o.gy1),X(o.gx1)-X(o.gx0),Y(o.gy0)-Y(o.gy1));
 // axes
 ctx.strokeStyle=C.ink;ctx.fillStyle=C.ink;ctx.lineWidth=Math.max(1.4,u*.085);
 const arr=(x0,y0,x1,y1)=>{ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();const a=Math.atan2(y1-y0,x1-x0),s=u*.35;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1-s*Math.cos(a-.4),y1-s*Math.sin(a-.4));ctx.lineTo(x1-s*Math.cos(a+.4),y1-s*Math.sin(a+.4));ctx.fill()};
 arr(X(o.gx0),Y(0),X(o.gx1)+u*.05,Y(0));arr(X(0),Y(o.gy0),X(0),Y(o.gy1)+u*.05);
 ctx.font=`italic ${u*.62}px "Times New Roman",serif`;ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText('x',X(o.gx1)-u*.3,Y(0)+u*.5);ctx.fillText('y',X(0)-u*.4,Y(o.gy1)+u*.35);
 ctx.font=`${u*.58}px "Times New Roman",serif`;
 for(const x of o.xt)ctx.fillText(x<0?'−'+(-x):x,X(x)+(x<0?-u*.08:0),Y(0)+u*.45);
 for(const y of o.yt)ctx.fillText(y<0?'−'+(-y):y,X(0)-u*.38,Y(y)+u*.02);
 if(o.zero)ctx.fillText('0',X(0)-u*.4,Y(0)-u*.4);
 ctx.restore()}
function clipG(G,o){const {ctx,X,Y}=G;ctx.save();ctx.beginPath();ctx.rect(X(o.gx0),Y(o.gy1),X(o.gx1)-X(o.gx0),Y(o.gy0)-Y(o.gy1));ctx.clip()}
function curve(G,pts,color,w,o={}){const {ctx,X,Y}=G;if(pts.length<2)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineJoin=ctx.lineCap='round';if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
 ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.stroke();ctx.restore()}
function dot(G,x,y,color,r){const {ctx,X,Y}=G;ctx.save();ctx.fillStyle=color;ctx.beginPath();ctx.arc(X(x),Y(y),r,0,7);ctx.fill();ctx.restore()}
function label(G,x,y,txt,color,size,o={}){const {ctx,X,Y}=G;ctx.save();ctx.fillStyle=color;ctx.font=`${o.italic===false?'':'italic '}${size}px "Times New Roman",serif`;ctx.textAlign=o.align||'left';ctx.textBaseline='middle';
 if(o.bg){const w=ctx.measureText(txt).width;ctx.fillStyle='rgba(255,255,255,.88)';ctx.fillRect(X(x)-(o.align==='center'?w/2:o.align==='right'?w:0)-3,Y(y)-size*.62,w+6,size*1.24);ctx.fillStyle=color}
 ctx.fillText(txt,X(x),Y(y));ctx.restore()}
function sample(f,a,b,n=160){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n,y=f(x);if(isFinite(y))p.push([x,y])}return p}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function distSeg(px,py,pts){let m=1e9;for(let i=1;i<pts.length;i++){const [ax,ay]=pts[i-1],[bx,by]=pts[i],dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy||1;let t=((px-ax)*dx+(py-ay)*dy)/L;t=cl(t,0,1);m=Math.min(m,Math.hypot(px-ax-t*dx,py-ay-t*dy))}return m}

/* ============ MODEL 1: inverse of y=(x+3)^2-4 ============ */
function Model1(){
 const f=x=>(x+3)**2-4;
 const st={t:1,a:-5,lineYX:true,b1:true,b2:true,restrict:false,play:0,quiz:null};
 const inV={x0:-7.30,x1:7.30,y0:-7.27,y1:6.30};
 const g={gx0:-7,gx1:7,gy0:-7,gy1:6,xt:[-6,-5,-4,-3,-2,-1,1,2,3,4,5,6],yt:[1,2,3,4,-1,-2,-3,-4,-5,-6]};
 const fv={x0:-8,x1:8,y0:-8,y1:7};
 function parab(){return sample(f,st.restrict?-3:-6.25,0.45,200)}
 function morph(t){return parab().map(([x,y])=>[x+(y-x)*t,y+(x-y)*t])}
 function draw(G,t,o){const u=Math.min(G.ux,G.uy);const gg=o.full?{...g,gx0:-8,gx1:8,gy0:-8,gy1:7}:g;grid(G,gg);clipG(G,gg);
  // axis of symmetry x=-3 (as in book)
  curve(G,[[-3,-6.8],[-3,5.8]],C.mag,u*.07);
  if(o.lineYX){curve(G,[[-7,-7],[6,6]],C.ref,u*.06,{dash:[u*.25,u*.15],alpha:o.lineA??1});label(G,-6.2,-6.4,'y = x',C.ref,u*.6,{bg:1})}
  const P=parab(),Pd=o.prog!=null?P.slice(0,Math.max(2,Math.floor(P.length*o.prog))):P;
  curve(G,Pd,C.mag,u*.12);
  if(t>0){const M=morph(t);
   if(t<1)curve(G,M,C.mag2,u*.11,{alpha:.9});
   else{const up=M.filter(([x,y])=>y>=-3-1e-6),lo=M.filter(([x,y])=>y<=-3+1e-6);
    if(o.b1)curve(G,up,o.color2?C.mag2:C.mag,u*.12);if(o.b2&&!st.restrict)curve(G,lo,o.color2?'#e07a1f':C.mag,u*.12)}}
  if(!o.noLabels){label(G,-6.9,4.5,'y = (x + 3)² − 4',C.mag,u*.6,{bg:1});
   if(t>=1){if(o.b1)label(G,2.1,-1.85,'y = −3 + √(x + 4)',o.color2?C.mag2:C.mag,u*.58,{bg:1});if(o.b2&&!st.restrict)label(G,1.8,-4.55,'y = −3 − √(x + 4)',o.color2?'#e07a1f':C.mag,u*.58,{bg:1})}}
  if(o.dots){const pts=[[-6,5],[-5,0],[-1,0],[0,5],[-3,-4]];if(t>=1)pts.push([-4,-3],[0,-1],[0,-5],[5,0]);for(const [x,y] of pts)dot(G,x,y,C.mag,u*.16)}
  G.ctx.restore()}
 return {
  id:'g1',title:'الدالة <span class="m">y = (x + 3)² − 4</span> ومعكوسها',sub:'سؤال ٣ · صفحة ٦٤',box:[546,458,938,822],
  inPage(ctx,W,H,time){const G=mkView(ctx,W,H,inV),T=time%9;
   let prog=1,t=0,lineA=0;
   if(T<1.6)prog=ease(T/1.6);else if(T<2.4)lineA=(T-1.6)/.8;else{lineA=1;t=ease(cl((T-2.4)/2.4,0,1))}
   ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
   draw(G,t,{prog,lineYX:lineA>0,lineA,b1:true,b2:true,dots:T>4.8,noLabels:T<4.8&&t<1});
   if(T<4.8&&prog>=1)label(G,-6.9,4.5,'y = (x + 3)² − 4',C.mag,Math.min(G.ux,G.uy)*.6,{bg:1})},
  focusView:fv,
  focus(ctx,W,H,dt){if(st.play){st.t=cl(st.t+dt/2.2,0,1);if(st.t>=1)st.play=0;sync()}
   const asp=W/H;let v={...fv};const cw=v.x1-v.x0,ch=v.y1-v.y0;if(asp>cw/ch){const nw=ch*asp;v.x0-=(nw-cw)/2;v.x1+=(nw-cw)/2}else{const nh=cw/asp;v.y0-=(nh-ch)/2;v.y1+=(nh-ch)/2}
   ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const G=mkView(ctx,W,H,v);this.G=G;const u=Math.min(G.ux,G.uy);
   draw(G,st.t,{full:1,lineYX:st.lineYX,b1:st.b1,b2:st.b2,dots:false,color2:true});
   // moving point & its mirror
   const a=st.restrict?Math.max(st.a,-3):st.a,b=f(a);
   dot(G,a,b,C.mag,u*.2);label(G,a+.2,b+.45,`(${fmt(a)}, ${fmt(b)})`,C.mag,u*.5,{bg:1});
   if(st.t>=1){curve(G,[[a,b],[b,a]],'#888',u*.04,{dash:[u*.15,u*.12]});dot(G,b,a,C.mag2,u*.2);label(G,b+.2,a-.45,`(${fmt(b)}, ${fmt(a)})`,C.mag2,u*.5,{bg:1})}
   if(this.hl){this.hl(G,u)}
   st.cur={a,b}},
  parts(){const P=parab(),M=morph(1),up=M.filter(p=>p[1]>=-3),lo=M.filter(p=>p[1]<=-3);
   return [
   {k:'f',name:'منحنى الدالة الأصلية',info:'y = (x + 3)² − 4 : قطع مكافئ رأسه (−3 , −4) ومحور تماثله المستقيم x = −3.',src:'من رسم الكتاب · ص ٦٤',hit:(x,y)=>distSeg(x,y,P)},
   {k:'y1',name:'الفرع y₁',info:'y₁ = −3 + √(x + 4)',src:'نص الكتاب · ص ٦٤',hit:(x,y)=>st.t>=1&&st.b1?distSeg(x,y,up):99},
   {k:'y2',name:'الفرع y₂',info:'y₂ = −3 − √(x + 4)',src:'نص الكتاب · ص ٦٤',hit:(x,y)=>st.t>=1&&st.b2&&!st.restrict?distSeg(x,y,lo):99},

  else{set('h',s.h);set('k',s.k);$('#hv').textContent=fmt(s.h);$('#kv').textContent=fmt(s.k);['parent','dom','ran'].forEach((k,i)=>$('#c'+(i+1)).checked=s[k])}
  const ro=m.readout();if($('#readout')._h!==ro){$('#readout').innerHTML=ro;$('#readout')._h=ro}};
 m.bind();info.style.display='none';$('#bookfig').style.display='none';$('#mFig').classList.remove('on');m.hl=null;qs=null;$('#mQuiz').classList.remove('on');
 sizeMC();const hr=m.el.getBoundingClientRect();
 card.animate([{transform:`translate(${hr.left-r.x}px,${hr.top-r.y}px) scale(${hr.width/r.w},${hr.height/r.h})`,opacity:.6},{transform:'none',opacity:1}],{duration:600,easing:'cubic-bezier(.2,.8,.2,1)'});
 requestAnimationFrame(()=>modal.classList.add('show'))}
async function closeModal(){if(!cur)return;const r=fr(),hr=cur.el.getBoundingClientRect();modal.classList.remove('show');
 await card.animate([{transform:'none',opacity:1},{transform:`translate(${hr.left-r.x}px,${hr.top-r.y}px) scale(${hr.width/r.w},${hr.height/r.h})`,opacity:.3}],{duration:450,easing:'cubic-bezier(.5,0,.3,1)'}).finished;
 modal.classList.remove('on');cur=null;sync=()=>{}}
$('#mClose').onclick=closeModal;addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#mFig').onclick=()=>{const b=$('#bookfig'),on=b.style.display!=='block';b.style.display=on?'block':'none';$('#mFig').classList.toggle('on',on);$('#readout').style.visibility=on?'hidden':'';
 if(on){$('#bfimg').src=FIG[cur.id];$('#bftitle').textContent='الرسم كما في الكتاب · ص ٦٤'}};
addEventListener('resize',()=>{layout();if(cur){place();sizeMC()}});
/* picking */
let pd=null;mc.addEventListener('pointerdown',e=>pd=[e.clientX,e.clientY]);
mc.addEventListener('pointerup',e=>{if(!pd||!cur||!cur.G)return;if(Math.hypot(e.clientX-pd[0],e.clientY-pd[1])>8)return;
 const r=mc.getBoundingClientRect(),d=mc.width/r.width,x=cur.G.ix((e.clientX-r.left)*d),y=cur.G.iy((e.clientY-r.top)*d);
 let best=null,bd=.5;for(const p of cur.parts()){const v=p.hit(x,y);if(v<bd){bd=v;best=p}}
 if(qs&&!qs.done){answer(best);return}
 if(!best){info.style.display='none';cur.hl=null;return}show(best)});
function hlPart(p,color){cur.hl=(G,u)=>{const {ctx}=G;ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle=color;ctx.lineWidth=u*.45;ctx.lineCap='round';
ctx.restore();
 ctx.save();ctx.fillStyle=color;ctx.globalAlpha=.16;const step=u*.25;for(let px=0;px<G.W;px+=step)for(let py=0;py<G.H;py+=step){if(p.hit(G.ix(px),G.iy(py))<.18){ctx.beginPath();ctx.arc(px,py,step*.75,0,7);ctx.fill()}}ctx.restore()}}
function show(p){hlPart(p,'#c4237f');info.innerHTML=`<button class="x">×</button><b>${p.name}</b><div class="m" style="white-space:normal;font-style:normal;font-family:Cairo;font-size:14px;direction:rtl">${p.info}</div><span class="src">${p.src}</span>`;info.style.display='block';info.querySelector('.x').onclick=()=>{info.style.display='none';cur.hl=null}}
$('#mQuiz').onclick=()=>{if(qs){endQ();return}qs={i:0,s:0,done:false};$('#mQuiz').classList.add('on');$('#ctl').style.display='none';info.style.display='none';rq()};
function rq(){const Q=cur.quiz,box=$('#quizbox');cur.hl=null;
 if(qs.i>=Q.length){qs.done=true;box.innerHTML=`<div class="quiz"><div class="qn">انتهى الاختبار</div><div class="score">${AD(qs.s)} / ${AD(Q.length)}</div><div class="btns"><button class="mb" id="qa">أعد الاختبار</button><button class="mb pri" id="qe">العودة للرسم</button></div></div>`;$('#qa').onclick=()=>{qs={i:0,s:0,done:false};rq()};$('#qe').onclick=endQ;return}
 const it=Q[qs.i];it.setup&&it.setup();sync();box.innerHTML=`<div class="quiz"><div class="qn">اختبرني · السؤال ${AD(qs.i+1)} من ${AD(Q.length)} · الدرجة ${AD(qs.s)}</div><div class="q">${it.q}</div><div class="fb" id="qfb">المس الإجابة على الرسم</div></div>`}
function answer(p){if(qs.lock)return;const it=cur.quiz[qs.i],ok=p&&p.k===it.a,fb=$('#qfb');qs.lock=1;const right=cur.parts().find(x=>x.k===it.a);
 if(ok){qs.s++;fb.className='fb ok';fb.textContent='إجابة صحيحة ✓';hlPart(right,'#2e9e5b')}else{fb.className='fb bad';fb.textContent='ليست هذه. الصحيح: '+right.name;hlPart(right,'#d4473f')}
 setTimeout(()=>{qs.lock=0;qs.i++;rq()},1700)}
function endQ(){qs=null;$('#mQuiz').classList.remove('on');$('#quizbox').innerHTML='';$('#ctl').style.display='';cur.hl=null}

/* ============ LOOP ============ */
let last=performance.now(),acc=0,T0=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(cur){cur.focus(mctx,mc.width,mc.height,dt);return}
 acc+=dt;if(acc<1/30)return;acc=0;const t=(now-T0)/1000;
 models.forEach(m=>{const c=m.cv;m.inPage(c.getContext('2d'),c.width,c.height,t)})}
(async()=>{try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2000))])}catch(e){}layout();requestAnimationFrame(frame)})();
window.__mp={openModal,closeModal,models,setZoom};
</script>
