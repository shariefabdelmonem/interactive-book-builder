<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>الفيزياء للصف الثالث الثانوي – الحث الكهرومغناطيسي (كتاب تفاعلي)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>
:root{--ui:#1d1a17;--ink:#2b2622;--acc:#e2a33b;--acc2:#2f7dd1;--ok:#2e9e5b;--bad:#d4473f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Cairo',system-ui,sans-serif;color:#f5efe6;background:#2a1a10}
button{font-family:inherit}
/* ---------- desk ---------- */
#desk{position:fixed;inset:0;overflow:hidden;
 background:
  radial-gradient(ellipse 70% 60% at 50% 42%, rgba(255,214,150,.42), rgba(255,190,110,.12) 45%, rgba(0,0,0,0) 70%),
  radial-gradient(ellipse 120% 90% at 50% 40%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.004 0.09' numOctaves='4' seed='7'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.25  0 0 0 0 0.13  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>"),
  repeating-linear-gradient(90deg, #6e4325 0 3px, #74482a 3px 9px, #6a4023 9px 14px, #7a4c2c 14px 22px),
  #6e4325;
 background-size:auto,auto,900px 900px,auto,auto}
#desk:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 239px,rgba(0,0,0,.25) 239px 241px,rgba(0,0,0,0) 241px 240px);pointer-events:none}
#lamp{position:absolute;top:30px;left:1vw;width:min(220px,30vw);pointer-events:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));z-index:1}
#glow{position:absolute;pointer-events:none;inset:0;background:radial-gradient(circle at 12% 6%, rgba(255,230,170,.35), rgba(255,220,150,0) 30%);mix-blend-mode:screen}
/* ---------- toolbar ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:20;
 background:linear-gradient(rgba(20,13,8,.85),rgba(20,13,8,.55));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08)}
#bar .ttl{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
#bar .ttl small{font-weight:600;opacity:.65;font-size:12px;margin-inline-start:6px}
.tb{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.14)}
.tb.on{background:var(--acc);color:#2b1a05;border-color:var(--acc)}
.tb svg{width:18px;height:18px;flex:none}
@media (max-width:640px){#hint{font-size:12px}.tb .lbl{display:none}.tb{padding:0 10px}#bar .ttl small{display:none}#bar .ttl{font-size:13px}}
/* ---------- stage / book ---------- */
#stage{position:fixed;top:54px;bottom:58px;left:0;right:0;perspective:1900px;perspective-origin:50% 10%;display:flex;align-items:center;justify-content:center;z-index:2}
#stage.zoomed{overflow:auto;display:block;perspective:none;touch-action:pan-x pan-y}
#bookwrap{position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.8,.3,1);touch-action:pan-y}
#stage.zoomed #bookwrap{margin:24px auto;transition:none;touch-action:auto}
#bookwrap.tilt{transform:rotateX(24deg) translateY(-2%)}
body.single #bookwrap.tilt{transform:rotateX(14deg)}
#book{position:relative;transform-style:preserve-3d}
#book:after{content:"";position:absolute;left:4%;right:4%;bottom:-3%;height:8%;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,0) 70%);transform:translateZ(-2px);pointer-events:none}
.slot{position:absolute;top:0;transform-style:preserve-3d}
.page{position:absolute;inset:0;background:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
.page img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.slot.L .page{box-shadow:-1px 1px 0 #e9e4da,-2px 2px 0 #d8d2c5,-3px 3px 0 #e9e4da,-4px 4px 0 #cfc8b9,-6px 7px 14px rgba(0,0,0,.45)}
.slot.R .page{box-shadow:1px 1px 0 #e9e4da,2px 2px 0 #d8d2c5,3px 3px 0 #e9e4da,4px 4px 0 #cfc8b9,6px 7px 14px rgba(0,0,0,.45)}
.slot.S .page{box-shadow:1px 1px 0 #e9e4da,2px 2px 0 #d8d2c5,3px 3px 0 #e9e4da,4px 4px 0 #cfc8b9,0 8px 18px rgba(0,0,0,.5)}
.spine{position:absolute;top:0;bottom:0;width:9%;pointer-events:none;z-index:3}
.slot.L .spine{right:0;background:linear-gradient(to left,rgba(0,0,0,.28),rgba(0,0,0,.08) 35%,rgba(0,0,0,0))}
.slot.R .spine{left:0;background:linear-gradient(to right,rgba(0,0,0,.28),rgba(0,0,0,.08) 35%,rgba(0,0,0,0))}
.slot.S .spine{display:none}
.leafshadow{position:absolute;top:0;bottom:0;pointer-events:none;opacity:0;z-index:4}
/* hotspot */
.hs{position:absolute;z-index:2;cursor:pointer;background:#fff;border-radius:3px}
.hs canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hs .badge{position:absolute;top:4px;left:4px;font-size:clamp(8px,1.25vw,12px);font-weight:800;color:#fff;background:linear-gradient(135deg,#2f7dd1,#6a4fd8);padding:1px 8px;border-radius:10px;box-shadow:0 2px 6px rgba(47,125,209,.45);pointer-events:none;animation:pulse 2.4s infinite}
.hs:hover{outline:2px solid rgba(47,125,209,.55);outline-offset:2px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
/* leaf */
.leaf{position:absolute;top:0;left:0;transform-style:preserve-3d;pointer-events:none;z-index:10}
.strip{position:absolute;top:0;transform-style:preserve-3d;transform-origin:100% 50%}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-color:#fff;background-repeat:no-repeat}
.face.back{transform:rotateY(180deg)}
.face i{position:absolute;inset:0;background:#000;opacity:0}
/* ---------- nav ---------- */
#nav{position:fixed;bottom:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:center;gap:14px;z-index:20;background:linear-gradient(rgba(20,13,8,0),rgba(20,13,8,.75))}
.nb{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:grid;place-items:center}
.nb:disabled{opacity:.3;cursor:default}
.nb svg{width:22px;height:22px}
#pinfo{min-width:150px;text-align:center;font-weight:700;font-size:14px}
#pinfo small{display:block;opacity:.6;font-size:11px;font-weight:600}
.side-arrow{position:fixed;top:50%;z-index:15;width:46px;height:90px;margin-top:-45px;border:none;background:rgba(0,0,0,.25);color:#fff;cursor:pointer;display:grid;place-items:center}
.side-arrow:disabled{opacity:0;pointer-events:none}
.side-arrow svg{width:26px;height:26px}
#sideNext{left:0;border-radius:0 12px 12px 0}
#sidePrev{right:0;border-radius:12px 0 0 12px}
body.single .side-arrow{display:none}
/* ---------- drawers ---------- */
.drawer{position:fixed;top:54px;bottom:0;right:0;width:min(360px,92vw);z-index:30;background:#1f1712;border-left:1px solid rgba(255,255,255,.1);transform:translateX(105%);transition:transform .35s cubic-bezier(.3,.8,.3,1);overflow:auto;padding:16px 16px 30px;box-shadow:-10px 0 30px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.drawer h3{margin:4px 0 4px;font-size:17px}
.drawer .note{font-size:12px;opacity:.6;margin-bottom:12px}
.drawer .grp{font-size:12px;font-weight:800;color:var(--acc);margin:16px 0 6px}
.drawer .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;background:rgba(255,255,255,.04);margin-bottom:6px;border:1px solid transparent}
.drawer .it:hover{border-color:rgba(255,255,255,.18)}
.drawer .it .pg{flex:none;font-size:12px;font-weight:800;background:rgba(255,255,255,.1);padding:2px 9px;border-radius:9px}
.drawer .it .sub{display:block;font-size:12px;opacity:.6;font-weight:600}
.drawer .it.mdl .pg{background:#2f7dd1}
#scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#hint{position:fixed;z-index:22;bottom:70px;line-height:1.6;left:50%;transform:translateX(-50%);background:rgba(20,13,8,.92);border:1px solid rgba(255,255,255,.15);padding:10px 16px;border-radius:14px;font-size:13px;max-width:92vw;text-align:center;transition:opacity .5s}
/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.on{display:block}
#mback{position:absolute;inset:0;background:rgba(12,8,5,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .45s}
#modal.show #mback{opacity:1}
#mcard{position:absolute;background:#fbf8f2;color:var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);display:grid;grid-template-columns:1fr 320px;grid-template-rows:auto 1fr;transform-origin:0 0}
#mhead{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid #e8e1d4;flex-wrap:wrap}
#mhead .t{flex:1;min-width:160px;font-weight:800;font-size:15px;line-height:1.3}
#mhead .t small{display:block;font-weight:600;font-size:12px;color:#8a7f70}
.mb{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:17px;border:1px solid #ddd3c2;background:#f6f1e8;color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.mb:hover{background:#efe7da}
.mb.on{background:#2f7dd1;border-color:#2f7dd1;color:#fff}
.mb.pri{background:#2b2622;color:#fff;border-color:#2b2622}
.mb svg{width:16px;height:16px}
#mview{position:relative;min-height:0;background:radial-gradient(circle at 50% 40%,#fff,#f1ebe0)}
#mview canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-120%);background:rgba(43,38,34,.88);color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:9px;white-space:nowrap;pointer-events:auto;cursor:pointer}
.lab:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:rgba(43,38,34,.88);border-bottom:0}
#info{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;border:1px solid #e3d9c7;border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.15);font-size:14px;line-height:1.75;display:none;max-height:45%;overflow:auto}
#info b{color:#2f7dd1;font-size:15px}
#info .src{font-size:11px;color:#8a7f70;display:block;margin-top:2px}
#info .x{float:left;border:none;background:none;font-size:20px;line-height:1;cursor:pointer;color:#8a7f70}
#readout{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92);border:1px solid #e3d9c7;border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.6;max-width:min(320px,70%);direction:rtl}
#readout .f{font-family:'Times New Roman',serif;font-size:16px;font-weight:700;direction:ltr;display:inline-block}
.meter{height:8px;background:#ece5d8;border-radius:4px;position:relative;overflow:hidden;margin:3px 0;direction:ltr}
.meter i{position:absolute;top:0;bottom:0;left:50%;background:#2f7dd1;border-radius:4px}
#bookfig{position:absolute;top:10px;left:10px;background:#fff;border:1px solid #e3d9c7;border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:none;max-width:48%;max-height:70%}
#bookfig canvas{display:block;max-width:100%;max-height:calc(70vh - 60px);width:auto;height:auto}
#bookfig div{font-size:12px;font-weight:700;color:#8a7f70;padding:2px 4px 6px}
#mpanel{overflow:auto;padding:12px 14px 20px;border-right:1px solid #e8e1d4;background:#fbf8f2}
#mpanel h4{margin:10px 0 6px;font-size:13px;color:#8a7f70}
.ctl{margin-bottom:12px}
.ctl label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px}
.ctl label span{color:#2f7dd1}
.ctl input[type=range]{width:100%;accent-color:#2f7dd1;direction:ltr}
.ctl .hint{font-size:11.5px;color:#7c7164;line-height:1.6;margin-top:3px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns .mb{flex:1 1 auto;justify-content:center}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg .mb{flex:1;justify-content:center;padding:0 6px;font-family:'Times New Roman',serif;font-style:italic;font-size:15px}
.casebox{background:#fff;border:1px solid #e3d9c7;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.75;margin-top:8px}
.quiz{background:#fff;border:2px solid #2f7dd1;border-radius:12px;padding:12px;font-size:14px;line-height:1.8}
.quiz .qn{font-size:12px;color:#8a7f70;font-weight:700}
.quiz .q{font-weight:800;margin:4px 0 8px}
.quiz .fb{font-weight:800;min-height:24px}
.quiz .fb.ok{color:var(--ok)}.quiz .fb.bad{color:var(--bad)}
.quiz .score{font-size:30px;font-weight:800;color:#2f7dd1;text-align:center}
@media (max-width:820px), (max-aspect-ratio:1/1){
 #mcard{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) minmax(0,40%)}
 #mpanel{border-right:none;border-top:1px solid #e8e1d4}
 #readout{font-size:12px;padding:6px 10px}
 #mhead{gap:6px;padding:8px 10px}
 #mhead .t{font-size:13px;flex-basis:100%}
 #mhead .t small{display:none}
 #mhead .mb{flex:1;justify-content:center}
 .mb{height:32px;padding:0 8px;font-size:12px}
 .mb svg{display:none}
 #readout{max-width:62%}
 #readout .f{font-size:14px}
}
</style>
</head>
<body>
<div id="desk">
 <svg id="lamp" viewBox="0 0 260 230" aria-hidden="true">
  <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#1c1d21"/><stop offset=".45" stop-color="#5b5d64"/><stop offset="1" stop-color="#18191c"/></linearGradient>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#202126"/><stop offset=".4" stop-color="#6a6c73"/><stop offset=".7" stop-color="#3a3b40"/><stop offset="1" stop-color="#16171a"/></linearGradient>
  <radialGradient id="bulb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffdf0"/><stop offset=".5" stop-color="#ffeab0"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs>
  <path d="M-20 -10 L110 70" stroke="url(#lg)" stroke-width="11" stroke-linecap="round"/>
  <circle cx="110" cy="70" r="11" fill="#2b2c31" stroke="#6a6c73" stroke-width="2"/>
  <path d="M110 70 L150 92" stroke="url(#lg)" stroke-width="9" stroke-linecap="round"/>
  <g transform="rotate(28 172 120)"><path d="M148 92 L196 92 L232 160 L112 160 Z" fill="url(#sh)"/><ellipse cx="172" cy="160" rx="60" ry="10" fill="#2a2b30"/><ellipse cx="172" cy="161" rx="50" ry="7" fill="url(#bulb)"/><rect x="160" y="84" width="24" height="10" rx="3" fill="#2b2c31"/></g>
  <ellipse cx="152" cy="200" rx="70" ry="22" fill="url(#bulb)" opacity=".75" transform="rotate(28 152 200)"/>
 </svg>
 <div id="glow"></div>
</div>

<div id="bar">
 <div class="ttl">الفيزياء للصف الثالث الثانوي <small>الفصل الثالث: الحث الكهرومغناطيسي · عينة الصفحات ٥٤–٥٩</small></div>
 <button class="tb" id="bToc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lbl">الفهرس</span></button>
 <button class="tb" id="bModels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg><span class="lbl">المجسّمات</span></button>
 <button class="tb" id="bFlat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l9-4 9 4M3 12l9-4 9 4"/></svg><span class="lbl">تسطيح الكتاب</span></button>
 <button class="tb" id="bZoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M11 8v6M8 11h6"/></svg><span class="lbl">تكبير</span></button>
</div>

<div id="stage"><div id="bookwrap" class="tilt"><div id="book"></div></div></div>

<button class="side-arrow" id="sideNext" aria-label="الصفحة التالية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="side-arrow" id="sidePrev" aria-label="الصفحة السابقة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg></button>

<div id="nav">
 <button class="nb" id="bPrev" aria-label="السابقة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg></button>
 <div id="pinfo"></div>
 <button class="nb" id="bNext" aria-label="التالية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>
</div>
<div id="hint">اسحب الورقة من اليسار إلى اليمين أو استخدم الأسهم لتقليب الصفحات · المس أي رسم عليه شارة «ثلاثي الأبعاد»</div>

<div id="scrim"></div>
<div class="drawer" id="dToc"></div>
<div class="drawer" id="dModels"></div>

<div id="modal">
 <div id="mback"></div>
 <div id="mcard">
  <div id="mhead">
   <div class="t" id="mtitle"></div>
   <button class="mb" id="mLabels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h12l4 5-4 5H3z"/></svg>الأسماء</button>
   <button class="mb" id="mQuiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5M12 17h.01"/></svg>اختبرني</button>
   <button class="mb" id="mFig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>رسم الكتاب</button>
   <button class="mb pri" id="mClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h12M10 6l-6 6 6 6M20 4v16"/></svg>إعادة إلى الصفحة</button>
  </div>
  <div id="mview">
   <div id="labels"></div>
   <div id="readout"></div>
   <div id="bookfig"><div id="bookfigT"></div><canvas id="bookfigC"></canvas></div>
   <div id="info"></div>
  </div>
  <div id="mpanel"></div>
 </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   BOOK DATA
   ========================================================= */
const PW=1088, PH=1526, AR=PW/PH;
const PAGES=[54,55,56,57,58,59];
const HOTSPOTS={
 55:[
  {id:'f-in', model:'faraday', preset:'in', box:[554,911,927,1159], fig:'شكل (٣-١أ)', title:'تجربة فاراداي — عند دخول المغناطيس'},
  {id:'f-out',model:'faraday', preset:'out',box:[164,900,521,1170], fig:'شكل (٣-١ب)', title:'تجربة فاراداي — عند خروج المغناطيس'}],
 57:[

class Flow{

  const geo=new THREE.ConeGeometry(size,size*2.6,10);for(let i=0;i<n;i++){const m=new THREE.Mesh(geo,this.mat);this.g.add(m);this.ps.push(m)}this.s=0;this.n=n}

  const a=this.pts[lo],b=this.pts[hi],u=(s-this.len[lo])/((this.len[hi]-this.len[lo])||1);return [a.clone().lerp(b,u),b.clone().sub(a).normalize()]}

  for(let i=0;i<this.n;i++){const [p,d]=this.at(this.s+i*this.L/this.n);this.ps[i].position.copy(p);if(cur<0)d.negate();this.ps[i].quaternion.setFromUnitVectors(up,d)}}
}

  else if(c.t==='seg'){d.innerHTML=`<label>${c.label}</label><div class="seg"></div>`;c.items.forEach(it=>{const b=document.createElement('button');b.className='mb';b.dataset.k=it.k;b.textContent=it.label;b.onclick=()=>c.fn(it.k);d.querySelector('.seg').appendChild(b)});reg[c.id]=d}
  else if(c.t==='html'){d.className='casebox';reg[c.id]=d}
  ctlBox.appendChild(d)}
 const q=document.createElement('div');q.id='quizbox';panel.appendChild(q);
 const tip=document.createElement('div');tip.className='ctl';tip.innerHTML='<div class="hint" style="margin-top:14px">اسحب بإصبع واحد للتدوير، وبإصبعين للتقريب. المس أي جزء لترى اسمه ووظيفته بكلمات الكتاب.</div>';panel.appendChild(tip)}
/* labels */
function buildLabels(inst){labelsEl.innerHTML='';for(const [id,p] of Object.entries(inst.parts)){const l=document.createElement('div');l.className='lab';l.textContent=p.name;l.dataset.id=id;l.onclick=()=>pick(id);labelsEl.appendChild(l);p._lab=l}labelsEl.style.display=showLabels?'':'none'}
$('#mLabels').onclick=()=>{showLabels=!showLabels;$('#mLabels').classList.toggle('on',showLabels);labelsEl.style.display=showLabels?'':'none'};
/* book figure */
$('#mFig').onclick=()=>{const bf=$('#bookfig'),on=bf.style.display!=='block';bf.style.display=on?'block':'none';$('#mFig').classList.toggle('on',on);$('#readout').style.visibility=on?'hidden':'';
 if(on){const h=curH,[x0,y0,x1,y1]=h.box,c=$('#bookfigC');c.width=x1-x0;c.height=y1-y0;c.getContext('2d').drawImage(imgs[h.page],x0,y0,x1-x0,y1-y0,0,0,x1-x0,y1-y0);$('#bookfigT').textContent=`${h.fig} كما في الكتاب · ص ${AD(h.page)}`}};
/* picking */
let pdown=null;
mview.addEventListener('pointerdown',e=>{if(e.target===renderer.domElement)pdown={x:e.clientX,y:e.clientY}});
mview.addEventListener('pointerup',e=>{if(!pdown||!modalInst)return;const m=Math.hypot(e.clientX-pdown.x,e.clientY-pdown.y);pdown=null;if(m>7)return;
 const r=renderer.domElement.getBoundingClientRect();const v=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
 ray.setFromCamera(v,modalInst.cam);const hits=ray.intersectObjects(modalInst.scene.children,true).filter(h=>h.object.userData.part&&h.object.visible&&!(h.object.material&&h.object.material.opacity===0));
 if(hits.length)pick(hits[0].object.userData.part);else{info.style.display='none';highlight(null)}});
function highlight(id,color=0x2f7dd1){if(!modalInst)return;Object.keys(modalInst.parts).forEach(k=>{partMats(modalInst.meshesOf[k]()).forEach(m=>{if(m.userData.e0==null){m.userData.e0=m.emissive.getHex();m.userData.ei0=m.emissiveIntensity}
  if(k===id){m.emissive.set(color);m.emissiveIntensity=.55}else{m.emissive.setHex(m.userData.e0);m.emissiveIntensity=m.userData.ei0}})});selected=id}
function pick(id){const p=modalInst.parts[id];if(!p)return;if(quizState&&!quizState.done){answer(id);return}
 highlight(id);info.innerHTML=`<button class="x" aria-label="إغلاق">×</button><b>${p.name}</b><div>«${p.info}»</div><span class="src">من نص الكتاب · ${p.src}</span>`;info.style.display='block';info.querySelector('.x').onclick=()=>{info.style.display='none';highlight(null)}}
/* quiz */
$('#mQuiz').onclick=()=>{if(quizState){endQuiz();return}quizState={i:0,score:0,done:false,lock:false};$('#mQuiz').classList.add('on');panel._ctl.style.display='none';info.style.display='none';highlight(null);renderQuiz()};
function renderQuiz(){const q=modalInst.quiz,s=quizState,box=$('#quizbox');
 if(s.i>=q.length){s.done=true;box.innerHTML=`<div class="quiz"><div class="qn">انتهى الاختبار</div><div class="score">${AD(s.score)} / ${AD(q.length)}</div><div style="text-align:center;font-weight:700">${s.score===q.length?'ممتاز! إجابات كلها صحيحة':s.score>=q.length/2?'جيد، راجع الأجزاء التي أخطأت فيها':'راجع الصفحة ثم حاول مرة أخرى'}</div><div class="btns" style="margin-top:10px"><button class="mb" id="qAgain">أعد الاختبار</button><button class="mb pri" id="qEnd">العودة إلى التجربة</button></div></div>`;
  $('#qAgain').onclick=()=>{quizState={i:0,score:0,done:false,lock:false};renderQuiz()};$('#qEnd').onclick=endQuiz;return}
 const it=q[s.i];if(it.setup)it.setup();
 box.innerHTML=`<div class="quiz"><div class="qn">اختبرني · السؤال ${AD(s.i+1)} من ${AD(q.length)} · الدرجة ${AD(s.score)}</div><div class="q">${it.q}</div><div class="fb" id="qfb">المس الجزء الصحيح في المجسّم</div></div>`}
function answer(id){const s=quizState;if(s.lock)return;const it=modalInst.quiz[s.i],ok=it.a.includes(id),fb=$('#qfb');s.lock=true;
 if(ok){s.score++;fb.className='fb ok';fb.textContent='إجابة صحيحة: '+modalInst.parts[id].name;highlight(id,0x2e9e5b)}
 else{fb.className='fb bad';fb.textContent='ليست هذه. الإجابة الصحيحة: '+modalInst.parts[it.a[0]].name;highlight(it.a[0],0xd4473f)}
 setTimeout(()=>{highlight(null);s.i++;s.lock=false;renderQuiz()},1700)}
function endQuiz(){quizState=null;$('#mQuiz').classList.remove('on');$('#quizbox').innerHTML='';panel._ctl.style.display='';highlight(null)}
/* per-frame */
const tmp=new THREE.Vector3();
function modalStep(dt){const inst=modalInst;inst.update(dt);controlsOC.update();renderer.render(inst.scene,inst.cam);
 if(showLabels){const r=renderer.domElement.getBoundingClientRect();for(const p of Object.values(inst.parts)){tmp.copy(p.anchor()).project(inst.cam);const vis=tmp.z<1;
  p._lab.style.display=vis?'':'none';p._lab.style.left=((tmp.x+1)/2*r.width)+'px';p._lab.style.top=((1-tmp.y)/2*r.height)+'px'}}}

   START
   ========================================================= */
(async()=>{try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]);await document.fonts.load('700 40px Cairo')}catch(e){}
 layout();requestAnimationFrame(frame)})();
window.__book={go,openModal,closeModal,jump,state:()=>({vi,single,views}),inst:()=>modalInst};
